name: iOS Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Run Flutter analyzer
        run: flutter analyze --no-fatal-infos || true
        continue-on-error: true

      - name: Run tests
        run: flutter test --no-pub

      - name: Prepare iOS build
        run: flutter build ios --debug --no-codesign

      - name: Build iOS for Simulator using xcodebuild
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ../build/ios \
            -arch arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO
          cd ..

      - name: Verify Runner.app exists
        run: |
          echo "Searching for Runner.app..."
          find build -name "Runner.app" -type d 2>/dev/null || true
          if [ -d "build/ios/Build/Products/Debug-iphonesimulator/Runner.app" ]; then
            echo "✅ Runner.app found at build/ios/Build/Products/Debug-iphonesimulator/Runner.app"
            ls -la build/ios/Build/Products/Debug-iphonesimulator/Runner.app
            # Copy to expected location for consistency
            mkdir -p build/ios/iphonesimulator
            cp -R build/ios/Build/Products/Debug-iphonesimulator/Runner.app build/ios/iphonesimulator/ || true
          elif [ -d "build/ios/iphonesimulator/Runner.app" ]; then
            echo "✅ Runner.app found at build/ios/iphonesimulator/Runner.app"
            ls -la build/ios/iphonesimulator/Runner.app
          else
            echo "❌ Runner.app not found at expected locations"
            echo "Build directory contents:"
            ls -la build/ios/ 2>/dev/null || true
            exit 1
          fi

      - name: Build iOS for Device (Release) - Optional
        run: flutter build ios --release --no-codesign || echo "⚠️ Device build skipped (requires code signing for production)"
        continue-on-error: true

      - name: Upload iOS build artifacts (Simulator)
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: |
            build/ios/iphonesimulator/Runner.app
            build/ios/Build/Products/Debug-iphonesimulator/Runner.app
          retention-days: 30
        if: success()
        continue-on-error: true

      - name: Upload iOS build artifacts (Device) - Optional
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-build
          path: build/ios/iphoneos/Runner.app
          retention-days: 30
        if: success() && hash build/ios/iphoneos/Runner.app 2>/dev/null
        continue-on-error: true

      - name: Display build info
        run: |
          echo "✅ iOS builds completed!"
          if [ -d "build/ios/iphonesimulator/Runner.app" ]; then
            echo "📱 Simulator build: build/ios/iphonesimulator/Runner.app (Ready for Appetize.io)"
          elif [ -d "build/ios/Build/Products/Debug-iphonesimulator/Runner.app" ]; then
            echo "📱 Simulator build: build/ios/Build/Products/Debug-iphonesimulator/Runner.app (Ready for Appetize.io)"
          fi
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            echo "📱 Device build: build/ios/iphoneos/Runner.app"
          fi

