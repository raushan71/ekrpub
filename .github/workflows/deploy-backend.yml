name: Deploy Laravel Backend to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'routes/**'
      - 'database/**'
      - 'config/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
      
      - name: Test SSH Connection
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'SSH connection successful'"
      
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          LARAVEL_PATH: ${{ secrets.LARAVEL_PATH }}
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << 'DEPLOY_EOF'
            set -e
            cd $LARAVEL_PATH || exit 1
            
            echo "Starting deployment..."
            echo "Current directory: $(pwd)"
            echo "Current branch: $(git branch --show-current)"
            
            # Pull latest code
            git fetch origin
            git pull origin main || exit 1
            
            # Install dependencies
            composer install --no-dev --optimize-autoloader --no-interaction
            
            # Run migrations
            php artisan migrate --force
            
            # Clear and cache
            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear
            
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # Optimize
            php artisan optimize
            
            # Set permissions
            chmod -R 755 storage bootstrap/cache
            chown -R www-data:www-data storage bootstrap/cache || true
            
            echo "Deployment completed successfully!"
          DEPLOY_EOF
      
      - name: Verify Deployment
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd ${{ secrets.LARAVEL_PATH }} && php artisan --version"

