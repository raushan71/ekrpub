name: Debug & Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  debug-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Check API configuration
        run: |
          echo "🔍 Checking API configuration..."
          if grep -q "ekray.com/api" lib/config/app_constants.dart; then
            echo "✅ API URL configured correctly: ekray.com/api"
          else
            echo "❌ API URL not found in app_constants.dart"
            exit 1
          fi

      - name: Check package name
        run: |
          echo "🔍 Checking package configuration..."
          if grep -q "name: ekray" pubspec.yaml; then
            echo "✅ Package name configured correctly: ekray"
          else
            echo "❌ Package name mismatch"
            exit 1
          fi

      - name: Check Firebase configuration
        run: |
          echo "🔍 Checking Firebase configuration..."
          if [ -f "android/app/google-services.json" ]; then
            echo "✅ Android Firebase config found"
          else
            echo "⚠️ Android Firebase config not found"
          fi
          if [ -f "ios/Runner/GoogleService-Info.plist" ]; then
            echo "✅ iOS Firebase config found"
          else
            echo "⚠️ iOS Firebase config not found"
          fi

      - name: Check bundle identifiers
        run: |
          echo "🔍 Checking bundle identifiers..."
          if grep -q "com.ekray.apps" android/app/build.gradle; then
            echo "✅ Android bundle ID: com.ekray.apps"
          else
            echo "❌ Android bundle ID mismatch"
            exit 1
          fi

      - name: Verify imports
        run: |
          echo "🔍 Checking for old package references..."
          # Check for uncommented package references (ignore comments)
          if grep -r "package:ready_ecommerce" lib/ --include="*.dart" | grep -v "^\s*//" | head -5; then
            echo "❌ Found old package references in code"
            exit 1
          else
            echo "✅ No old package references found in code"
          fi

      - name: Check for build errors
        run: |
          echo "🔍 Running build check..."
          flutter build apk --debug --dry-run || echo "⚠️ Build check completed"

      - name: Display summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 Debug Check Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Configuration verified"
          echo "✅ No critical issues found"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

