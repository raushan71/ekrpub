plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.ekray.apps"
    compileSdkVersion = 36
    ndkVersion = flutter.ndkVersion

    def keystoreProperties = new Properties()
    def keystorePropertiesFile = rootProject.file("key.properties")
    def keystoreExists = false
    def keystoreFilePath = null
    
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
        def storeFile = keystoreProperties['storeFile']
        if (storeFile != null && !storeFile.isEmpty()) {
            try {
                // Handle both absolute and relative paths
                def storeFilePath = storeFile.replace('\\', '/')
                
                // Skip Windows absolute paths (C:/, D:/, etc.) in CI environment
                if (storeFilePath.matches('^[A-Za-z]:.*')) {
                    println "⚠️ Skipping Windows absolute path in CI: ${storeFilePath}"
                    keystoreExists = false
                } else if (!storeFilePath.startsWith('/')) {
                    // Relative path - resolve from root project
                    def resolvedPath = rootProject.file(storeFilePath)
                    if (resolvedPath.exists()) {
                        keystoreFilePath = resolvedPath.getAbsolutePath()
                        keystoreExists = true
                    }
                } else {
                    // Absolute Unix path
                    def keystoreFile = file(storeFilePath)
                    if (keystoreFile.exists()) {
                        keystoreFilePath = storeFilePath
                        keystoreExists = true
                    }
                }
            } catch (Exception e) {
                println "⚠️ Error checking keystore file: ${e.message}"
                keystoreExists = false
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    defaultConfig {
        applicationId "com.ekray.apps"
        multiDexEnabled = true
        minSdkVersion flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (keystoreExists && keystoreFilePath != null) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile = file(keystoreFilePath)
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            shrinkResources = true
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreExists) {
                signingConfig = signingConfigs.release
            } else {
                // Use debug signing for CI builds (unsigned release)
                signingConfig = signingConfigs.debug
            }
        }
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
//    implementation 'androidx.window:window:1.0.0'
//    implementation 'androidx.window:window-java:1.0.0'

}

